name: potolki_mobile
description: "Приложение для рассчёта натяжных потолков"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Иконки
  cupertino_icons: ^1.0.8

  # Генерация и выгрузка PDF (для сметы клиенту)
  pdf: ^3.10.8
  printing: ^5.13.1

  # Календарь-планировщик (для замеров и монтажей)
  table_calendar: ^3.1.0
  calendar_date_picker2: ^1.1.8

  # Форматирование дат и чисел (рубли, даты)
  intl: ^0.19.0

  # Офлайн БД для локального хранения объектов и клиентов без интернета
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true